name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download face model
        run: |
          mkdir -p app/src/main/assets
          for REPO in shubham0204/FaceRecognition_With_FaceNet_Android atharvakale31/Real-Time_Face_Recognition_Android syaringan357/Android-MobileFaceNet-MTCNN-FaceAntiSpoofing estebanuri/face_recognition shubham0204/OnDevice-Face-Recognition-Android; do
            for b in master main; do
              P=$(curl -fsSL "https://api.github.com/repos/$REPO/git/trees/$b?recursive=1" 2>/dev/null | grep -io '"path": *"[^"]*\(facenet\|face_net\|mobilefacenet\)[^"]*\.tflite"' | grep -iv "512\|quant" | head -1 | sed 's/.*"path": *"//; s/"$//')
              if [ -n "$P" ]; then
                echo "found $REPO@$b:$P"
                curl -fsSL -o app/src/main/assets/facenet.tflite "https://raw.githubusercontent.com/$REPO/$b/$P" && [ $(stat -c%s app/src/main/assets/facenet.tflite) -gt 100000 ] && break 2
                rm -f app/src/main/assets/facenet.tflite
              fi
            done
          done
          ls -la app/src/main/assets || true

      - name: Download fonts
        run: |
          mkdir -p app/src/main/assets/fonts && cd app/src/main/assets/fonts
          curl -fsSL -o fa-solid-900.ttf https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-solid-900.ttf || true
          for f in IBMPlexSans-Regular IBMPlexSans-Medium IBMPlexSans-SemiBold; do curl -fsSL -o $f.ttf https://cdn.jsdelivr.net/npm/@ibm/plex@6.4.1/IBM-Plex-Sans/fonts/complete/ttf/$f.ttf || curl -fsSL -o $f.ttf https://raw.githubusercontent.com/IBM/plex/v6.4.0/IBM-Plex-Sans/fonts/complete/ttf/$f.ttf || true; done
          curl -fsSL -o IBMPlexMono-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexmono/IBMPlexMono-Regular.ttf || true
          ls -la
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MyWallpaper-apk
          path: app/build/outputs/apk/debug/*.apk
