name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download face model
        run: |
          mkdir -p app/src/main/assets
          for b in main master; do
            curl -fsSL -o app/src/main/assets/facenet.tflite "https://raw.githubusercontent.com/shubham0204/OnDevice-Face-Recognition-Android/$b/app/src/main/assets/facenet.tflite" && break
          done
          ls -la app/src/main/assets || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MyWallpaper-apk
          path: app/build/outputs/apk/debug/*.apk
