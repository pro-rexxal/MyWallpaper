name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download face model
        run: |
          mkdir -p app/src/main/assets
          REPO=shubham0204/OnDevice-Face-Recognition-Android
          for b in main master; do
            P=$(curl -fsSL "https://api.github.com/repos/$REPO/git/trees/$b?recursive=1" | grep -o '"path": *"[^"]*facenet\.tflite"' | head -1 | sed 's/.*"path": *"//; s/"$//')
            echo "branch $b -> $P"
            if [ -n "$P" ]; then curl -fsSL -o app/src/main/assets/facenet.tflite "https://raw.githubusercontent.com/$REPO/$b/$P" && break; fi
          done
          ls -la app/src/main/assets || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MyWallpaper-apk
          path: app/build/outputs/apk/debug/*.apk
